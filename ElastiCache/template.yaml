AWSTemplateFormatVersion: 2010-09-09
Description: A CloudFormation template to run an EC2 instance to connect to ElastiCache Redis Cluster 

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
  SubnetID: 
    Type: String
    Default:  subnet-016504b33fee4c0bc
  ImageID:
    Type: String  
    Default: ami-0e35ddab05955cf57
  myVPC:
    Type: String
    Default: vpc-043aa264bbdd65d4d
  mysecurityGroup:
    Type: String
    Default: sg-06d0c094aa641a478

Resources:
  MyEC2Instance: 
    Type: AWS::EC2::Instance
    Properties: 
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageID
      SubnetId: !Ref SubnetID
      IamInstanceProfile: !Ref EC2InstanceProfile
      KeyName: mykey
      SecurityGroupIds:
       - !Ref mysecurityGroup
      UserData: !Base64 |
        #!/bin/bash
        sudo su -
        # Install necessary packages
        sudo apt update -y             
        sudo apt upgrade -y  
        sudo apt install -y python3-pip
        sudo apt install -y python3-dev

        # Install Python packages
        sudo apt install -y redis-tools

  # Create the IAM Role for the EC2 Instance
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "sts:AssumeRole"
            Principal:
              Service: ec2.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role
